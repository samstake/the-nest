name: Update Hot Philly List

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate new month file
        run: node scripts/update-hot-philly.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/hot-philly/
          git diff --staged --quiet || git commit -m "chore: roll hot Philly list to new month"
          git push
