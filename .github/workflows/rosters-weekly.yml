name: Update Team Rosters

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Bump roster metadata
        run: node scripts/update-rosters-weekly.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/rosters/
          git diff --staged --quiet || git commit -m "chore: weekly roster metadata refresh"
          git push
